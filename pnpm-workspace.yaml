packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': true
  ffmpeg-static: true
  # 两者都有预编译的可选依赖，安装脚本只是兜底编译，不需要跑。
  '@parcel/watcher': false
  '@swc/core': false

minimumReleaseAgeExclude:
  - '@eloqnt/config@0.1.1'
  - '@eloqnt/format-po@0.1.1'
  - '@next/env@16.3.7'
  - '@next/swc-darwin-arm64@16.3.7'
  - '@next/swc-darwin-x64@16.3.7'
  - '@next/swc-linux-arm64-gnu@16.3.7'
  - '@next/swc-linux-arm64-musl@16.3.7'
  - '@next/swc-linux-x64-gnu@16.3.7'
  - '@next/swc-linux-x64-musl@16.3.7'
  - '@next/swc-win32-arm64-msvc@16.3.7'
  - '@next/swc-win32-x64-msvc@16.3.7'
  - framer-motion@13.4.6
  - icu-minify@4.14.8
  - motion-dom@13.4.5
  - motion@13.4.6
  - next-intl-swc-plugin-extractor@4.14.8
  - next-intl@4.14.8
  - next@16.3.7
  - use-intl@4.14.8
