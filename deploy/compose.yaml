# 在服务器上：docker compose -f deploy/compose.yaml --env-file ../.env up -d --build
# 环境变量见 deploy/.env.example；服务器上的 .env 放在源码目录外面，重新部署不会被覆盖。
name: motif

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_MOTIF_PREVIEW_URL: https://${PREVIEW_HOST:?set PREVIEW_HOST}
        MOTIF_SITE_URL: https://${SITE_HOST:?set SITE_HOST}
    image: motif:latest
    command: ['pnpm', '--filter', '@motif/web', 'start']
    restart: unless-stopped
    environment:
      MOTIF_SITE_URL: https://${SITE_HOST:?set SITE_HOST}
      MOTIF_COMMUNITY_DATA: /data/community
      MOTIF_CHAIN_RPC_URL: ${MOTIF_CHAIN_RPC_URL:-}
      MOTIF_CHAIN_PUBLIC_RPC_URL: ${MOTIF_CHAIN_PUBLIC_RPC_URL:-}
      MOTIF_CHAIN_START_BLOCK: ${MOTIF_CHAIN_START_BLOCK:-0}
      MOTIF_CHAIN_NAME: ${MOTIF_CHAIN_NAME:-}
      # 工作台（Studio）：站点内置的模型 key，只在服务端；不配就关闭 agent，手动编辑仍然可用。
      MOTIF_AGENT_PROVIDER: ${MOTIF_AGENT_PROVIDER:-}
      MOTIF_AGENT_API_KEY: ${MOTIF_AGENT_API_KEY:-}
      MOTIF_AGENT_MODEL: ${MOTIF_AGENT_MODEL:-}
      MOTIF_AGENT_BASE_URL: ${MOTIF_AGENT_BASE_URL:-}
      MOTIF_AGENT_SESSION_TOKENS: ${MOTIF_AGENT_SESSION_TOKENS:-}
      MOTIF_STUDIO_DATA: /data/studio
      # 前面只有 Caddy 一层代理：限流按它写的客户端地址计数。
      MOTIF_TRUSTED_PROXY_HOPS: '1'
      # 账号、积分、用户仓库（docs/decisions/0009）：SQLite 放在数据卷里，随每天的备份一起备份。
      MOTIF_DB_PATH: /data/db/motif.sqlite
      MOTIF_AUTH_SECRET: ${MOTIF_AUTH_SECRET:?set MOTIF_AUTH_SECRET}
      MOTIF_ADMIN_EMAILS: ${MOTIF_ADMIN_EMAILS:-}
      MOTIF_SUPPORT_EMAIL: ${MOTIF_SUPPORT_EMAIL:-}
      MOTIF_GITHUB_CLIENT_ID: ${MOTIF_GITHUB_CLIENT_ID:-}
      MOTIF_GITHUB_CLIENT_SECRET: ${MOTIF_GITHUB_CLIENT_SECRET:-}
      MOTIF_GITHUB_TOKEN: ${MOTIF_GITHUB_TOKEN:-}
      MOTIF_SMTP_HOST: ${MOTIF_SMTP_HOST:-}
      MOTIF_SMTP_PORT: ${MOTIF_SMTP_PORT:-465}
      MOTIF_SMTP_USER: ${MOTIF_SMTP_USER:-}
      MOTIF_SMTP_PASSWORD: ${MOTIF_SMTP_PASSWORD:-}
      MOTIF_MAIL_FROM: ${MOTIF_MAIL_FROM:-}
      MOTIF_CREDITS_SIGNUP_BONUS: ${MOTIF_CREDITS_SIGNUP_BONUS:-}
      MOTIF_CREDITS_UNLOCK_ITEM: ${MOTIF_CREDITS_UNLOCK_ITEM:-}
      MOTIF_CREDITS_UNLOCK_SKILL: ${MOTIF_CREDITS_UNLOCK_SKILL:-}
      MOTIF_CREDITS_PER_1K_INPUT: ${MOTIF_CREDITS_PER_1K_INPUT:-}
      MOTIF_CREDITS_PER_1K_OUTPUT: ${MOTIF_CREDITS_PER_1K_OUTPUT:-}
      MOTIF_CREDITS_STUDIO_MINIMUM: ${MOTIF_CREDITS_STUDIO_MINIMUM:-}
      MOTIF_CREDITS_CUSTOM_ORDER: ${MOTIF_CREDITS_CUSTOM_ORDER:-}
    volumes:
      # 社区投稿的源码只存在这里（链上只有哈希），必须持久化并备份（deploy/backup.sh）；工作台的会话也放在这里。
      - community-data:/data
    expose: ['3000']

  preview:
    # 和 web 用同一个镜像（由 web 的 build 构建），不去镜像仓库拉。
    image: motif:latest
    pull_policy: never
    depends_on: [web]
    command: ['pnpm', '--filter', '@motif/preview', 'start']
    restart: unless-stopped
    environment:
      MOTIF_PREVIEW_HOST: 0.0.0.0
      MOTIF_PREVIEW_PORT: '4100'
    expose: ['4100']

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web, preview]
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      SITE_HOST: ${SITE_HOST}
      PREVIEW_HOST: ${PREVIEW_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  community-data:
  caddy-data:
  caddy-config:
